<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>QR Allergen Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#eef2f7;
  padding:20px;
}

.container{
  max-width:520px;
  margin:auto;
  background:white;
  border-radius:25px;
  padding:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  font-size:32px;
  color:#111827;
}

.header p{
  color:#6b7280;
  margin-top:5px;
}

#reader{
  width:100%;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:20px;
}

.product-card{
  display:none;
  background:#f8fafc;
  border-radius:20px;
  padding:20px;
}

.product-card h2{
  font-size:30px;
  margin-bottom:10px;
  color:#111827;
}

.section{
  margin-top:20px;
}

.section h3{
  margin-bottom:12px;
  color:#1e293b;
}

.ingredients-box{
  background:white;
  padding:15px;
  border-radius:15px;
  border:1px solid #e5e7eb;
  color:#374151;
  line-height:1.6;
}

.allergen-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.allergen-item{
  background:white;
  border-radius:16px;
  padding:14px;
  border:2px solid #fee2e2;
  display:flex;
  align-items:center;
  gap:12px;
}

.icon{
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:18px;
}

.red{
  background:#ef4444;
}

.orange{
  background:#f97316;
}

.yellow{
  background:#eab308;
}

.blue{
  background:#2563eb;
}

.allergen-name{
  font-size:17px;
  font-weight:600;
  color:#111827;
}

.warning{
  margin-top:20px;
  padding:16px;
  border-radius:15px;
  background:#fff7ed;
  color:#c2410c;
  font-weight:600;
}

.footer{
  text-align:center;
  margin-top:20px;
  color:#6b7280;
  font-size:14px;
}

.scan-btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:18px;
  background:#2563eb;
  color:white;
  font-size:18px;
  margin-top:20px;
  cursor:pointer;
}

.scan-btn:hover{
  background:#1d4ed8;
}

.safe-box{
  background:#dcfce7;
  color:#15803d;
  padding:14px;
  border-radius:15px;
  font-weight:bold;
}

@media(max-width:500px){

  .allergen-grid{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>QR Allergen Scanner</h1>
<p>Scan product QR code to check allergens</p>
</div>

<div id="reader"></div>

<div class="product-card" id="productCard">

<h2 id="productName"></h2>

<div class="section">

<h3>Ingredients</h3>

<div class="ingredients-box" id="ingredients"></div>

</div>

<div class="section">

<h3>Allergens</h3>

<div class="allergen-grid" id="allergens"></div>

</div>

<div class="warning" id="warning"></div>

</div>

<button class="scan-btn">
<i class="fa-solid fa-qrcode"></i>
Scan Another Product
</button>

<div class="footer">
Powered by QR Allergen Scanner
</div>

</div>

<script>

// Product Database
const products = {

  "12345": {

    name: "Chocolate Biscuit",

    ingredients:
    "Wheat Flour, Sugar, Milk Powder, Cocoa",

    allergens: [

      {
        name:"Milk",
        icon:"fa-glass-water",
        color:"orange"
      },

      {
        name:"Gluten",
        icon:"fa-wheat-awn",
        color:"yellow"
      },

      {
        name:"Egg",
        icon:"fa-egg",
        color:"red"
      },

      {
        name:"Fish",
        icon:"fa-fish",
        color:"blue"
      }

    ],

    warning:
    "Contains milk, gluten, egg and fish."

  },

  "67890": {

    name: "Peanut Cookies",

    ingredients:
    "Peanuts, Wheat Flour, Butter",

    allergens: [

      {
        name:"Peanut",
        icon:"fa-peanut",
        color:"red"
      },

      {
        name:"Milk",
        icon:"fa-glass-water",
        color:"orange"
      },

      {
        name:"Gluten",
        icon:"fa-wheat-awn",
        color:"yellow"
      },

      {
        name:"Fish",
        icon:"fa-fish",
        color:"blue"
      }

    ],

    warning:
    "Not safe for peanut allergy users."

  },

  "11111": {

    name: "Fruit Juice",

    ingredients:
    "Apple, Orange, Sugar",

    allergens: [],

    warning:
    "No major allergens detected."

  }

};

function onScanSuccess(decodedText){

  const product = products[decodedText];

  if(product){

    document.getElementById("productCard")
    .style.display = "block";

    document.getElementById("productName")
    .innerText = product.name;

    document.getElementById("ingredients")
    .innerText = product.ingredients;

    document.getElementById("warning")
    .innerText = product.warning;

    const allergenDiv =
    document.getElementById("allergens");

    allergenDiv.innerHTML = "";

    if(product.allergens.length > 0){

      product.allergens.forEach(item => {

        allergenDiv.innerHTML += `

        <div class="allergen-item">

          <div class="icon ${item.color}">
            <i class="fa-solid ${item.icon}"></i>
          </div>

          <div class="allergen-name">
            ${item.name}
          </div>

        </div>

        `;

      });

    } else {

      allergenDiv.innerHTML = `

      <div class="safe-box">
        ✅ Safe Product
      </div>

      `;

    }

  }else{

    alert("Product not found!");

  }

}

function onScanFailure(error){}

const html5QrcodeScanner =
new Html5QrcodeScanner(

  "reader",

  {
    fps:10,
    qrbox:250
  },

  false

);

html5QrcodeScanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>
</html>
