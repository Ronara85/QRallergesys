<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
<title>Allergen Product Viewer</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#f4f4f4;
  padding:20px;
}

.card{
  max-width:550px;
  margin:auto;
  background:white;
  border-radius:25px;
  padding:25px;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.product-image{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:20px;
  margin-bottom:20px;
}

h1{
  font-size:32px;
  margin-bottom:20px;
  font-weight:bold;
}

.section-title{
  font-size:24px;
  margin-top:25px;
  margin-bottom:15px;
  font-weight:bold;
}

.info-box{
  background:#fafafa;
  border:2px solid #e5e5e5;
  border-radius:15px;
  padding:18px;
  font-size:20px;
}

.allergen-grid{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
}

.allergen-item{
  display:flex;
  align-items:center;
  gap:12px;
  border:2px solid #e5e5e5;
  border-radius:18px;
  padding:12px 18px;
  font-size:22px;
  background:white;
}

.icon{
  width:45px;
  height:45px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  color:white;
}

/* colors */

.milk{
  background:#ff7b39;
}

.gluten{
  background:#f5a623;
}

.peanut{
  background:#7b3f1d;
}

.egg{
  background:#d4a62a;
}

.fish{
  background:#27a9e1;
}

.warning-box{
  margin-top:20px;
  border:2px solid #ffb3b3;
  background:#fff5f5;
  color:#d60000;
  padding:18px;
  border-radius:18px;
  font-size:22px;
  font-weight:bold;
  display:flex;
  align-items:center;
  gap:12px;
}

</style>
</head>

<body>

<div class="card">

  <img 
    class="product-image"
    src="https://images.unsplash.com/photo-1588166524941-3bf61a9c41db?q=80&w=1200&auto=format&fit=crop"
  >

  <h1 id="name"></h1>

  <div class="section-title">
    Ingredients
  </div>

  <div class="info-box" id="ingredients"></div>

  <div class="section-title">
    Allergens
  </div>

  <div class="allergen-grid" id="allergens"></div>

  <div class="section-title">
    Warning
  </div>

  <div class="warning-box" id="warning"></div>

</div>

<script>
.icon i{
  font-size:22px;
  color:white;
}
const products = {

  "12345":{
    name:"Chocolate Biscuit",
    ingredients:"Milk, Wheat, Sugar",
    allergens:["milk","gluten"],
    warning:"Contains Milk & Gluten"
  },

  "67890":{
    name:"Peanut Cookies",
    ingredients:"Peanut, Butter, Wheat",
    allergens:["peanut","gluten"],
    warning:"Danger for peanut allergy"
  }

};

// allergen details

const allergenData = {

  milk:{
    icon:'<i class="fa-solid fa-glass-water"></i>',
    label:"Milk",
    class:"milk"
  },

  gluten:{
    icon:'<i class="fa-solid fa-wheat-awn"></i>',
    label:"Grain",
    class:"gluten"
  },

  peanut:{
    icon:'<i class="fa-solid fa-seedling"></i>',
    label:"Peanuts",
    class:"peanut"
  },

  egg:{
    icon:'<i class="fa-solid fa-egg"></i>',
    label:"Eggs",
    class:"egg"
  },

  fish:{
    icon:'<i class="fa-solid fa-fish"></i>',
    label:"Fish",
    class:"fish"
  }

};

// URL id

const params = new URLSearchParams(window.location.search);

const id = params.get("id") || "12345";

const product = products[id];

if(product){

  document.getElementById("name").innerText =
    product.name;

  document.getElementById("ingredients").innerText =
    product.ingredients;

  document.getElementById("warning").innerHTML =
    `⚠️ ${product.warning}`;

  let html = "";

  product.allergens.forEach(item=>{

    const a = allergenData[item];

 html += `

<div class="allergen-item">

  <div class="icon ${a.class}">
    ${a.icon}
  </div>

  <div>
    ${a.label}
  </div>

</div>

`;
  });

  document.getElementById("allergens").innerHTML =
    html;

}else{

  document.body.innerHTML =
    "<h1>Product Not Found</h1>";

}

</script>

</body>
</html>
