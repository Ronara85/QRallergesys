<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Allergen Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f6f9;
      padding:20px;
    }

    .container{
      max-width:500px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:15px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      margin-bottom:20px;
      color:#1e293b;
    }

    #reader{
      width:100%;
      margin-bottom:20px;
    }

    .product-card{
      background:#f8fafc;
      padding:15px;
      border-radius:10px;
      border:1px solid #ddd;
      display:none;
    }

    .product-card h2{
      margin-bottom:10px;
      color:#0f172a;
    }

    .section{
      margin-top:15px;
    }

    .badge{
      display:inline-block;
      padding:8px 12px;
      border-radius:20px;
      margin:5px;
      font-size:14px;
    }

    .danger{
      background:#fee2e2;
      color:#dc2626;
    }

    .safe{
      background:#dcfce7;
      color:#15803d;
    }

    .warning{
      margin-top:15px;
      padding:12px;
      border-radius:10px;
      background:#fef3c7;
      color:#92400e;
    }

    .footer{
      text-align:center;
      margin-top:20px;
      color:#64748b;
      font-size:14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>QR Allergen Scanner</h1>

  <div id="reader"></div>

  <div class="product-card" id="productCard">

    <h2 id="productName"></h2>

    <div class="section">
      <h3>Ingredients</h3>
      <p id="ingredients"></p>
    </div>

    <div class="section">
      <h3>Allergens</h3>
      <div id="allergens"></div>
    </div>

    <div class="warning" id="warning"></div>

  </div>

  <div class="footer">
    Scan product QR code to check allergens
  </div>

</div>

<script>

  // Sample Product Database
  const products = {

    "12345": {
      name: "Chocolate Biscuit",
      ingredients: "Wheat Flour, Sugar, Milk Powder, Cocoa",
      allergens: ["Milk", "Gluten"],
      warning: "Contains milk and gluten."
    },

    "67890": {
      name: "Peanut Cookies",
      ingredients: "Peanuts, Wheat Flour, Butter",
      allergens: ["Peanut", "Milk", "Gluten"],
      warning: "Not safe for peanut allergy."
    },

    "11111": {
      name: "Fruit Juice",
      ingredients: "Apple, Orange, Sugar",
      allergens: [],
      warning: "No major allergens detected."
    }

  };

  function onScanSuccess(decodedText) {

    const product = products[decodedText];

    if(product){

      document.getElementById("productCard").style.display = "block";

      document.getElementById("productName").innerText = product.name;

      document.getElementById("ingredients").innerText = product.ingredients;

      document.getElementById("warning").innerText = product.warning;

      const allergenDiv = document.getElementById("allergens");

      allergenDiv.innerHTML = "";

      if(product.allergens.length > 0){

        product.allergens.forEach(item => {

          allergenDiv.innerHTML += `
            <span class="badge danger">
              ⚠️ ${item}
            </span>
          `;

        });

      } else {

        allergenDiv.innerHTML = `
          <span class="badge safe">
            ✅ Safe Product
          </span>
        `;
      }

    } else {

      alert("Product not found!");

    }

  }

  function onScanFailure(error) {
    // ignore errors
  }

  const html5QrcodeScanner = new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,
      qrbox: 250
    },
    false
  );

  html5QrcodeScanner.render(onScanSuccess, onScanFailure);

</script>

</body>
</html>
